[package]
name = "ipssl"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Wildcard DNS for any IP address: 10-0-0-1.ipssl.cc -> 10.0.0.1"
license = "MIT"
publish = false

[[bin]]
name = "ipssl-dns"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arc-swap = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
hickory-server = { version = "0.26.3", default-features = false }
ipnet = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
socket2 = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
