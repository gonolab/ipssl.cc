[package]
name = "ipssl"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
description = "Wildcard DNS for any IP address: 10-0-0-1.ipssl.cc -> 10.0.0.1"
license = "MIT"
publish = false

[[bin]]
name = "ipssl-dns"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arc-swap = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
# Hex and base64 for acme.key, and MACs as hex; already pulled in by hickory.
data-encoding = "2"
# HMAC-SHA256 for the writes between the challenge API and the name
# servers. Pure Rust, so the static musl builds need no C toolchain.
hmac = "0.13"
hickory-server = { version = "0.26.3", default-features = false }
ipnet = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", default-features = false }
socket2 = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
# For errno constants (EAFNOSUPPORT) and kill(2) for --reload; already
# pulled in by tokio.
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
