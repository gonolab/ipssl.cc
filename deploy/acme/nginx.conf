# TLS front for the DNS-01 challenge API, inside the server block that
# serves the zone's website (https://ipssl.cc). Clients then use
# https://ipssl.cc/acme as the endpoint.
#
# The API trusts X-Real-IP only from loopback, so keep it listening on
# 127.0.0.1 (acme.api_listen) and set the header here.

location = /acme/present {
    limit_except POST {
        deny all;
    }
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8054/present;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
}

location = /acme/cleanup {
    limit_except POST {
        deny all;
    }
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8054/cleanup;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
}
