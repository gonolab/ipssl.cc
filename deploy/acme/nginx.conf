# TLS front for the DNS-01 challenge API, inside the server block that
# serves the zone's website (https://ipssl.cc). Clients then use
# https://ipssl.cc/acme as the endpoint.
#
# The API trusts X-Real-IP only from loopback, so keep it listening on
# 127.0.0.1 (acme.api_listen) and set the header here.
#
# The API rate-limits each client network by that address, and the
# network that presents a value is the only one that can clean it up.
# With another proxy, load balancer or CDN in front of nginx,
# $remote_addr is that proxy, so every user would share one rate limit
# and one owner. Have nginx take the client's address from the header
# the proxy sets, in the server block, for example:
#
#     set_real_ip_from 203.0.113.0/24;   # the proxy's own addresses
#     real_ip_header X-Forwarded-For;    # or CF-Connecting-IP for Cloudflare
#     real_ip_recursive on;
#
# $remote_addr below is then the client again. Trust only the proxy's
# addresses, or anyone can pick their own X-Real-IP.

location = /acme/present {
    limit_except POST {
        deny all;
    }
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8054/present;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
}

location = /acme/cleanup {
    limit_except POST {
        deny all;
    }
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8054/cleanup;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
}
