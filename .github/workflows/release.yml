# Publish a GitHub release with static Linux binaries when a version tag
# such as v0.2.0 is pushed. The tag must match the version in Cargo.toml.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One run per tag at a time. If the tag is moved while a run is building,
# the next run waits, and the older one fails its tag check instead of
# publishing binaries of the old commit.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    # Each target builds on a runner of the same architecture, so tests run
    # on the real thing and no cross toolchain is needed. The project is
    # pure Rust, so the musl targets need no C toolchain either.
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Install Rust
        run: |
          # Some runner images come without rustup.
          if ! command -v rustup > /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable

      - name: Test
        run: cargo test --locked --release --target "$TARGET"

      - name: Build
        run: cargo build --locked --release --target "$TARGET"

      - name: Package
        run: |
          name="ipssl-dns-$GITHUB_REF_NAME-$TARGET"
          mkdir "$name"
          cp "target/$TARGET/release/ipssl-dns" config.example.toml README.md LICENSE "$name/"
          cp deploy/ipssl-dns.service deploy/ipssl-acme-api.service "$name/"
          # The DNS-01 hooks and the nginx snippet, at the paths the README
          # links to.
          mkdir "$name/deploy"
          cp -R deploy/acme "$name/deploy/"
          # Smoke test the packaged binary.
          file "$name/ipssl-dns" || true
          "$name/ipssl-dns" --version
          "$name/ipssl-dns" --check -c config.example.toml
          tar -czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ipssl-dns-*.tar.gz
          if-no-files-found: error

  msrv:
    name: Minimum Rust version
    # CI checks rust-version on main and pull requests only; a tag may
    # point at a commit that went through neither.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the rust-version from Cargo.toml
        run: |
          msrv=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          rustup toolchain install "$msrv" --profile minimal
          rustup default "$msrv"

      - run: cargo check --locked --all-targets

  publish:
    name: Publish release
    needs: [build, msrv]
    runs-on: ubuntu-24.04
    # The only job that can write: it creates the release.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: sha256sum ipssl-dns-*.tar.gz > SHA256SUMS

      - name: Check the tag still points at the built commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --verify-tag below only checks that the tag exists. Peel
          # annotated tags down to the commit.
          obj=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.type + " " + .object.sha')
          while [ "${obj% *}" = tag ]; do
            obj=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/${obj#* }" --jq '.object.type + " " + .object.sha')
          done
          if [ "${obj#* }" != "$GITHUB_SHA" ]; then
            echo "::error::tag $GITHUB_REF_NAME now points at ${obj#* }, but this run built $GITHUB_SHA"
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          # Tags like v0.3.0-rc.1 become pre-releases. A "-" in build
          # metadata (after "+", as in v0.3.0+build-1) does not count.
          case "${GITHUB_REF_NAME%%+*}" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            "${flags[@]}"
