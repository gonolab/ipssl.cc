# Example config for ipssl-dns. Copy to config.toml and adjust.
# SIGHUP (`systemctl reload ipssl-dns`) reloads everything except `listen`,
# `tcp_timeout_secs`, `[rate_limit]` and `[metrics]`, which need a restart.
# All addresses are documentation examples (198.51.100.0/24, 2001:db8::/32);
# replace them before going live.

# The zone this server is authoritative for
domain = "ipssl.cc"

# Addresses to listen on, for both UDP and TCP.
# On Ubuntu, systemd-resolved holds 127.0.0.53:53, which can make binding
# 0.0.0.0:53 fail: either disable its stub listener or list the server's
# public IP here instead.
listen = ["0.0.0.0:53", "[::]:53"]

# Idle timeout for TCP connections, in seconds
tcp_timeout_secs = 10

# CAs allowed to issue certificates for every name in the zone (CAA at the
# apex). Leave empty so users can get certificates from any ACME CA
# (Let's Encrypt, ZeroSSL, Google Trust Services, ...).
caa_issuers = []

# Names embedding an address in these networks get NXDOMAIN
# (for handling abuse reports)
blocklist = []

# Authoritative name servers. Create glue records with the same names at
# the registrar. In production use at least two, with different providers
# in different regions.
[[nameservers]]
name = "ns1.ipssl.cc"
ipv4 = ["198.51.100.1"]
ipv6 = ["2001:db8::1"]

[[nameservers]]
name = "ns2.ipssl.cc"
ipv4 = ["198.51.100.2"]
ipv6 = ["2001:db8::2"]

# UDP response rate limiting, so the server cannot be used to flood
# someone with forged queries. Each client network gets its own limit.
# Over the limit, every `slip`-th response is sent truncated, which makes
# real resolvers retry over TCP (never limited); the rest are dropped.
[rate_limit]
# Responses per second per client network; 0 turns limiting off
responses_per_second = 50
# Responses a client network may get at once before the rate applies
burst = 100
slip = 2
# Size of a client network, in prefix bits
ipv4_prefix = 24
ipv6_prefix = 56
# Never limited, e.g. your monitoring
exempt = []
# Most client networks tracked at once (bounds memory)
max_tracked = 100000

# Prometheus metrics at http://<listen>/metrics. Remove the section to turn
# them off. Keep the address private: loopback or an internal network.
[metrics]
listen = "127.0.0.1:9153"

[soa]
email = "hostmaster@ipssl.cc"
# Bump on config changes; any scheme works, e.g. YYYYMMDDnn
serial = 2026110501
# How long resolvers cache negative answers (NXDOMAIN / NODATA), in seconds
minimum = 300

[ttl]
# A/AAAA computed from the name. The result never changes, so this can be long.
ip = 86400
# Fixed records: SOA, NS, CAA and the hosts below
records = 3600

# Fixed records. Keys are relative to `domain`; "@" is the apex. Each host
# takes `a`, `aaaa`, `txt` and `mx`.
# - txt: one record per entry. Values over 255 bytes (RSA DKIM keys) are
#   split into 255-byte strings automatically; paste them in one piece.
# - mx: `exchange` is always a full host name, never relative to `domain`.
#   { preference = 0, exchange = "." } alone is a null MX: no mail accepted.
# Note: "ip" is reserved. A TXT query for ip.ipssl.cc returns the address
# of whoever asked.

[hosts."@"]
a = ["198.51.100.10"]
# Mail for the domain, e.g. abuse@ipssl.cc
mx = [{ preference = 10, exchange = "mail.example.net" }]
txt = ["v=spf1 mx -all"]

[hosts._dmarc]
txt = ["v=DMARC1; p=quarantine; rua=mailto:postmaster@ipssl.cc"]

[hosts.www]
a = ["198.51.100.10"]
