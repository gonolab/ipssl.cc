# Example config for ipssl-dns. Copy to config.toml and adjust.
# SIGHUP (`systemctl reload ipssl-dns`) reloads everything except `listen`,
# `tcp_timeout_secs`, `[rate_limit]`, `[metrics]` and `[acme]`, which need
# a restart. `systemctl reload` checks the whole file the way `--check` and
# startup do and waits for the server; it fails if the server keeps the
# running config.
# All addresses are documentation examples (198.51.100.0/24, 2001:db8::/32);
# replace them before going live. install.sh refuses to start a service
# while any remain outside `blocklist`.

# The zone this server is authoritative for
domain = "ipssl.cc"

# Addresses to listen on, for both UDP and TCP: at least one, with a real
# port (not 0). They must not overlap each other or the `[metrics]` and
# `[acme]` listeners (a wildcard such as 0.0.0.0 covers every address of
# its family). IPv6 addresses are IPv6-only, so 0.0.0.0:53 and [::]:53 can
# be used together; on a system without IPv6, [::] is skipped with a
# warning.
# On a server with more than one public address, list each of them here
# instead of the wildcards: a wildcard socket can send a UDP reply from
# another address than the one queried, and resolvers ignore such replies.
# On Ubuntu, systemd-resolved holds 127.0.0.53:53, which can make binding
# 0.0.0.0:53 fail. Either list the server's public IP here instead, or
# disable the stub listener; in that case, also point /etc/resolv.conf at
# /run/systemd/resolve/resolv.conf (see the README): the host's own
# lookups would otherwise reach this server, which answers only for the
# zone.
listen = ["0.0.0.0:53", "[::]:53"]

# Idle timeout for TCP connections, in seconds
tcp_timeout_secs = 10

# CAs allowed to issue certificates for every name in the zone (CAA at the
# apex). Leave empty so users can get certificates from any ACME CA
# (Let's Encrypt, ZeroSSL, Google Trust Services, ...).
caa_issuers = []

# Names embedding an address in these networks get NXDOMAIN (for handling
# abuse reports). An entry blocks every name that encodes an address in
# it, in any form and with any other labels, not only the reported one.
blocklist = []

# Authoritative name servers. Create glue records with the same names at
# the registrar. In production use at least two, with different providers
# in different regions.
[[nameservers]]
name = "ns1.ipssl.cc"
ipv4 = ["198.51.100.1"]
ipv6 = ["2001:db8::1"]

[[nameservers]]
name = "ns2.ipssl.cc"
ipv4 = ["198.51.100.2"]
ipv6 = ["2001:db8::2"]

# UDP response rate limiting, so the server cannot be used to flood
# someone with forged queries. Each client network gets its own limit.
# Over the limit, every `slip`-th response is sent truncated, which makes
# real resolvers retry over TCP (never limited); the rest are dropped.
[rate_limit]
# Responses per second per client network; 0 turns limiting off
responses_per_second = 50
# Responses a client network may get at once before the rate applies
burst = 100
slip = 2
# Size of a client network, in prefix bits
ipv4_prefix = 24
ipv6_prefix = 56
# Never limited, e.g. your monitoring
exempt = []
# Most client networks tracked at once (bounds memory). A network whose
# limit has refilled is forgotten, and when the table is full a new network
# takes its place; new networks share a single limit only while every
# tracked network is still active.
max_tracked = 100000

# Prometheus metrics at http://<listen>/metrics. Remove the section to turn
# them off. Keep the address private: loopback or an internal network.
[metrics]
listen = "127.0.0.1:9153"

# DNS-01 challenges for names with private addresses (10-0-2-2.ipssl.cc),
# so they can get certificates from a public CA. Off while the section is
# missing. Two parts read it:
# - every name server holds challenge values in memory and takes writes
#   on `listen` from `writers` only;
# - `ipssl-dns --acme-api` (see deploy/ipssl-acme-api.service) runs on the
#   web host behind a TLS proxy, checks each request and sends it to all
#   name servers.
# Names with public addresses keep using HTTP-01 / TLS-ALPN-01.
#[acme]
# Name servers: plain HTTP for writes from the API host. Open this port
# to the `writers` only.
#listen = "0.0.0.0:8053"
#writers = ["198.51.100.10"]
# API: keep it on loopback behind the proxy, which sets X-Real-IP
#api_listen = "127.0.0.1:8054"
# Name server write endpoints; empty means each name server's first
# address of the `listen` family (IPv4 for 0.0.0.0, IPv6 for [::]) on the
# `listen` port. List them here when a name server has no such address,
# e.g. one outside the zone: the API refuses to start without them. A
# list here needs an endpoint for every name server host: with fewer
# --check fails. Name servers that share an address (one host serving two
# names) count as one host, which only logs a warning.
#nodes = []
# API requests per client network
#requests_per_minute = 10
#burst = 20
# Shared key that signs every write between the API and the name servers,
# and every answer (HMAC-SHA256): at least 32 random bytes as hex or
# base64, e.g. from `openssl rand -hex 32`. Use the same key on the API
# host and every name server. This file stays readable by every local
# account, so keep other users off these hosts. A name server with a key
# takes only signed writes; the API trusts only signed answers. The
# clocks must agree within 30 seconds: run NTP, and see the README (DNS-01
# API, step 4) for waiting for the time sync at boot. Upgrade the binaries
# before adding a key: older versions refuse it and print it in the error.
#key = "..."
# API only, while the key is being rolled out: also trust unsigned answers
# from name servers that do not have the key yet. Remove it once they all
# do.
#allow_unsigned_nodes = true

[soa]
# Contact address for the SOA record. Dots before the @ are fine
# (admin.dns@example.net); that part must be 1 to 63 printable ASCII
# characters, without spaces or backslashes.
email = "hostmaster@ipssl.cc"
# Bump on config changes; any scheme works, e.g. YYYYMMDDnn
serial = 2026110501
# How long resolvers cache negative answers (NXDOMAIN / NODATA), in seconds
minimum = 300

[ttl]
# A/AAAA computed from the name. The result never changes, so this can be long.
ip = 86400
# Fixed records: SOA, NS, CAA and the hosts below
records = 3600

# Fixed records. Keys are relative to `domain`; "@" is the apex. Each host
# takes `a`, `aaaa`, `txt` and `mx`.
# - Keys are matched without regard to case, so two keys that differ only
#   in case are an error. `*` and backslashes are not allowed: there are
#   no wildcard hosts.
# - Each address type stands alone: a host without `a` keeps the IPv4
#   address its name encodes (and one without `aaaa` its IPv6 address), so
#   a TXT record on "10-0-0-1" leaves its A record alone. A host's own `a`
#   or `aaaa` records replace the encoded address of that type.
# - With `[acme]` on, a host whose name can take a DNS-01 challenge (such
#   as "_acme-challenge.10-0-2-2") is an error: the challenges would hide it.
# - With `[acme]` on, a host with a public `a` or `aaaa` address keeps the
#   name one label above it ("10-0-2-2" for "app.10-0-2-2") from taking
#   DNS-01 challenges, since a wildcard certificate for that name would
#   cover the host. The server warns about such names.
# - txt: one record per entry. Values over 255 bytes (RSA DKIM keys) are
#   split into 255-byte strings automatically; paste them in one piece.
# - mx: `exchange` is always a full host name, never relative to `domain`.
#   { preference = 0, exchange = "." } alone is a null MX: no mail accepted.
# Note: "ip" is reserved. A TXT query for ip.ipssl.cc returns the address
# of whoever asked.

[hosts."@"]
a = ["198.51.100.10"]
# Mail for the domain, e.g. abuse@ipssl.cc
mx = [{ preference = 10, exchange = "mail.example.net" }]
txt = ["v=spf1 mx -all"]

[hosts._dmarc]
txt = ["v=DMARC1; p=quarantine; rua=mailto:postmaster@ipssl.cc"]

[hosts.www]
a = ["198.51.100.10"]
